apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: zaitseva-hw3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:latest
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_MODE
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: REDIS_MODE
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: REDIS_PASSWORD
